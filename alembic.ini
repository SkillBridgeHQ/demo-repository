# SkillBridge Waitlist Backend - Alembic Configuration

[alembic]

# Migration scripts directory
script_location = alembic

# Chronological migration filename
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# Make project root importable
prepend_sys_path = .

# Migration version directory
version_path_separator = os

# Database URL is intentionally empty.
# The actual validated DATABASE_URL will be loaded dynamically
# through app.core.config.get_settings() in alembic/env.py.
# Never put database credentials in this file.
sqlalchemy.url =


# ==========================================
# Logging Configuration
# ==========================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console
qualname =


[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S